on:
  workflow_dispatch:
  pull_request:
    # run in each PR in this repo
    branches: '**'
  push:
    branches: '**'
  schedule:
    # also run a schedule everyday at 1 AM.
    # this is to check that all dependencies are still available
    - cron:  '0 1 * * *'

name: check

permissions: read-all

jobs:
  R-code-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}
          # the minimum R version declared in DESCRIPTION; only the hard dependencies
          # (Imports) are installed, since some suggested packages (e.g. arrow, readxl)
          # need a newer R; tests and examples skip when a suggested package is missing
          - {os: ubuntu-latest,  r: '4.1', hard-deps-only: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.hard-deps-only && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install gdal on macOS for sf-related parts
        if: runner.os == 'macOS'
        run: |
          brew install proj
          brew install gdal
          brew link --overwrite gcc
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.hard-deps-only && '"hard"' || '"all"' }}
          extra-packages: ${{ matrix.config.hard-deps-only && 'any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown' || 'any::rcmdcheck' }}
          needs: check
          upgrade: 'TRUE'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  R-code-check-hard-dependencies:
    # check with only the hard dependencies (Imports), so that unguarded use of suggested packages is detected
    runs-on: ubuntu-latest
    name: ubuntu-latest (R-release, hard dependencies only)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown
          needs: check
          upgrade: 'TRUE'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
