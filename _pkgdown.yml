title: "plot2"
url: "https://msberends.github.io/plot2/"

template:
  bootstrap: 5
  bootswatch: "united"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

articles:
  - title: Guides
    navbar: ~
    contents:
      - supported_types
      - articles/colours-and-themes
      - articles/maps
      - articles/fonts
      - articles/plot2-for-ggplot2-users

reference:
  - title: Creating plots
    desc: >
      `plot2()` creates a complete plot from data in one call. Its methods
      accept data frames, vectors, tables, formulas, matrices, models and
      geographic data. `add_type()` and its shortcuts add layers to a plot.
    contents:
      - plot2
      - plot2-methods
      - add_type

  - title: Changing plots
    desc: >
      Change the mapping or the order of the layers of an existing plot, or
      use the coordinate system of spider plots.
    contents:
      - add_mapping
      - move_layer
      - coord_spider

  - title: Colours
    desc: >
      Get colours from names and palettes, and register the colours of an
      organisation for use in all plots.
    contents:
      - get_colour

  - title: Themes, titles and labels
    desc: >
      The default theme of `plot2()`, markdown in titles, and labelling
      functions for axes and data labels.
    contents:
      - theme_minimal2
      - md_to_expression
      - get_plot_title
      - labellers
      - label_taxonomy

  - title: Number formatting
    desc: >
      The decimal mark and thousands separator, determined from the
      session or set with options.
    contents:
      - dec_mark

  - title: Interactive use
    desc: >
      Convert a plot to an interactive `plotly` widget, or build a plot in
      a Shiny app.
    contents:
      - as_plotly
      - create_interactively

  - title: Options
    desc: >
      Package options that set defaults for all plots in a session.
    contents:
      - plot2-options

  - title: Data sets
    desc: >
      Example data sets used in the documentation.
    contents:
      - admitted_patients
      - netherlands

  - title: "`dplyr` and `tidyselect` functions"
    desc: >
      These are functions from `dplyr` and `tidyselect` that can be used in
      `plot2()` directly, without the need to load those packages first.
    contents:
      - reexports
